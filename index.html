<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#050810" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>GTA Fable — Neon City</title>
    <style>
      :root {
        --cyan: #00ffe0;
        --pink: #ff6af0;
        --red: #ff2a50;
        --gold: #f0b800;
        --dim: rgba(0,0,0,0.72);
        --border: rgba(0,255,224,0.18);
        --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
      }
      * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
      html, body {
        width:100%; height:100%; overflow:hidden;
        background:#050810; touch-action:none;
        overscroll-behavior:none; user-select:none; -webkit-user-select:none;
        font-family: var(--font);
      }

      /* ---- canvas + CRT overlay ---- */
      #game {
        position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none;
      }
      /* CRT scanlines — lightweight pseudo-element on body */
      body::after {
        content:''; position:fixed; inset:0; pointer-events:none; z-index:100;
        background:repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0,0,0,0.08) 2px,
          rgba(0,0,0,0.08) 4px
        );
      }

      /* ---- glitch animation on canvas ---- */
      @keyframes glitch-shift {
        0%   { clip-path:inset(30% 0 60% 0); transform:translate(-4px,0); }
        25%  { clip-path:inset(5%  0 80% 0); transform:translate(4px,0);  }
        50%  { clip-path:inset(60% 0 20% 0); transform:translate(-2px,0); }
        75%  { clip-path:inset(80% 0 5%  0); transform:translate(6px,0);  }
        100% { clip-path:inset(30% 0 60% 0); transform:translate(-4px,0); }
      }
      #game.glitch::before, #game.glitch::after {
        content:''; position:fixed; inset:0; pointer-events:none; z-index:4;
        background:inherit;
        animation: glitch-shift 0.12s steps(1) infinite;
      }
      #game.glitch::before { filter:hue-rotate(90deg); opacity:0.3; }
      #game.glitch::after  { filter:hue-rotate(-90deg); opacity:0.2; animation-delay:0.04s; }

      /* ---- UI layer ---- */
      #ui { position:fixed; inset:0; pointer-events:none; z-index:10; }

      /* ---- heat bar ---- */
      .heat-bar-wrap {
        position:absolute; top:0; left:0; right:0;
        display:flex; align-items:center; gap:8px;
        padding:4px calc(14px + env(safe-area-inset-left)) 4px calc(14px + env(safe-area-inset-right));
        background:rgba(0,0,0,0.6);
        border-bottom:1px solid var(--border);
        pointer-events:none;
      }
      .heat-label {
        font-size:9px; font-weight:800; letter-spacing:3px;
        color:var(--cyan); opacity:0.7; flex-shrink:0; width:36px;
      }
      .heat-track {
        flex:1; height:5px; border-radius:3px;
        background:rgba(255,255,255,0.08);
        overflow:hidden;
      }
      .heat-fill {
        height:100%; width:0%; border-radius:3px;
        background:var(--cyan);
        transition: width 0.3s ease-out, background 0.4s ease;
        box-shadow:0 0 6px currentColor;
      }
      @keyframes heat-pulse {
        0%,100% { opacity:1; } 50% { opacity:0.45; }
      }
      .heat-bar-wrap.heat-alert .heat-fill { animation: heat-pulse 0.4s infinite; }
      .heat-bar-wrap.heat-alert .heat-label { color:var(--red); }

      /* ---- virtual joystick ---- */
      .joy-zone {
        position:absolute; left:0; top:0; bottom:0; width:50%;
        pointer-events:auto; touch-action:none;
      }
      .joy-base {
        position:absolute; width:124px; height:124px;
        margin-left:-62px; margin-top:-62px; border-radius:50%;
        border:2px solid rgba(0,255,224,0.4);
        background:rgba(0,255,224,0.05);
        backdrop-filter:blur(2px); display:none; pointer-events:none;
      }
      .joy-knob {
        position:absolute; width:56px; height:56px;
        margin-left:-28px; margin-top:-28px; border-radius:50%;
        background:rgba(0,255,224,0.6); box-shadow:0 0 12px var(--cyan);
        display:none; pointer-events:none;
      }
      .joy-hint {
        position:absolute; left:24px;
        bottom:calc(36px + env(safe-area-inset-bottom));
        width:96px; height:96px; border-radius:50%;
        border:2px dashed rgba(0,255,224,0.2);
        display:flex; align-items:center; justify-content:center;
        color:rgba(0,255,224,0.3); font-size:11px; letter-spacing:1px;
        pointer-events:none;
      }

      /* ---- right buttons ---- */
      .btn-stack {
        position:absolute;
        right:calc(18px + env(safe-area-inset-right));
        bottom:calc(24px + env(safe-area-inset-bottom));
        display:flex; flex-direction:column; align-items:flex-end;
        gap:14px; pointer-events:none;
      }
      .touch-btn {
        pointer-events:auto; touch-action:none;
        border-radius:50%; border:2px solid rgba(255,255,255,0.35);
        color:#fff; font-weight:700; letter-spacing:1px;
        display:flex; align-items:center; justify-content:center;
        text-shadow:0 1px 3px rgba(0,0,0,0.6);
        transition:transform 0.06s, background 0.06s;
        backdrop-filter:blur(4px);
      }
      .touch-btn.pressed { transform:scale(0.91); }
      .btn-gas {
        width:96px; height:96px; font-size:16px;
        background:rgba(0,255,100,0.18);
        border-color:rgba(0,255,100,0.7);
      }
      .btn-gas.pressed { background:rgba(0,255,100,0.45); box-shadow:0 0 20px rgba(0,255,100,0.5); }
      .btn-brake {
        width:80px; height:80px; font-size:13px;
        background:rgba(255,42,80,0.18);
        border-color:rgba(255,42,80,0.7);
      }
      .btn-brake.pressed { background:rgba(255,42,80,0.45); box-shadow:0 0 20px rgba(255,42,80,0.5); }
      .btn-action {
        width:72px; height:72px; font-size:12px;
        background:rgba(0,200,255,0.18);
        border-color:rgba(0,200,255,0.7);
        opacity:0.35;
      }
      .btn-action.available {
        opacity:1;
        animation:pulse-action 1.1s infinite;
      }
      .btn-action.pressed { background:rgba(0,200,255,0.5); }
      @keyframes pulse-action {
        0%,100% { box-shadow:0 0 0 0 rgba(0,200,255,0.6); }
        50%      { box-shadow:0 0 0 14px rgba(0,200,255,0); }
      }

      /* ---- HUD top-left ---- */
      .hud-top {
        position:absolute;
        top:calc(28px + env(safe-area-inset-top));
        left:calc(14px + env(safe-area-inset-left));
        display:flex; flex-direction:column; gap:8px; pointer-events:none;
      }
      .minimap {
        width:132px; height:132px; border-radius:50%;
        border:2px solid rgba(0,255,224,0.45);
        box-shadow:0 0 14px rgba(0,255,224,0.2), 0 4px 14px rgba(0,0,0,0.7);
      }
      .mode-badge {
        align-self:flex-start; padding:3px 10px; border-radius:4px;
        background:var(--dim); color:var(--cyan);
        font-size:10px; font-weight:800; letter-spacing:3px;
        border:1px solid var(--border);
      }

      /* ---- Speedometer ---- */
      .speedo {
        position:absolute;
        right:calc(18px + env(safe-area-inset-right));
        top:calc(28px + env(safe-area-inset-top));
        text-align:right; color:#fff; pointer-events:none;
        text-shadow:0 0 12px var(--cyan), 0 2px 6px rgba(0,0,0,0.8);
      }
      .speedo .val {
        font-size:42px; font-weight:900; line-height:1;
        font-variant-numeric:tabular-nums; color:var(--cyan);
      }
      .speedo .unit {
        font-size:11px; letter-spacing:3px; color:rgba(0,255,224,0.5);
      }

      /* ---- Wallet ---- */
      .wallet {
        position:absolute;
        left:calc(14px + env(safe-area-inset-left));
        bottom:calc(160px + env(safe-area-inset-bottom));
        display:flex; flex-direction:column; gap:4px; pointer-events:none;
      }
      .wallet-row { display:flex; align-items:center; gap:6px; }
      .wallet-icon {
        font-size:13px; width:16px; text-align:center;
      }
      .wallet-icon.clean { color:var(--cyan); }
      .wallet-icon.dirty { color:var(--pink); }
      .wallet-val {
        font-size:16px; font-weight:800; letter-spacing:1px;
        font-variant-numeric:tabular-nums;
        text-shadow:0 0 8px currentColor;
        min-width:52px;
      }
      .wallet-val.clean { color:var(--cyan); }
      .wallet-val.dirty { color:var(--pink); }

      /* ---- Context prompt ---- */
      .prompt {
        position:absolute; left:50%;
        bottom:calc(150px + env(safe-area-inset-bottom));
        transform:translateX(-50%);
        padding:7px 18px; border-radius:4px;
        background:var(--dim); border:1px solid var(--border);
        color:var(--cyan); font-size:13px; font-weight:700;
        letter-spacing:1px; white-space:nowrap;
        display:none; pointer-events:none;
        text-shadow:0 0 8px var(--cyan);
      }

      /* ---- Event banner ---- */
      .event-banner {
        position:absolute; left:50%; top:calc(30px + env(safe-area-inset-top));
        transform:translateX(-50%);
        min-width:280px; max-width:340px;
        background:rgba(5,8,20,0.9);
        border:1px solid var(--border);
        border-radius:6px; padding:14px 18px;
        display:none; flex-direction:column; gap:8px;
        box-shadow:0 0 24px rgba(0,255,224,0.15);
        pointer-events:none;
        animation:banner-in 0.25s ease-out;
      }
      @keyframes banner-in {
        from { opacity:0; transform:translateX(-50%) translateY(-10px); }
        to   { opacity:1; transform:translateX(-50%) translateY(0); }
      }
      .event-banner.active-mission { border-color:rgba(240,184,0,0.4); }
      .event-title {
        font-size:12px; font-weight:900; letter-spacing:3px;
        color:var(--cyan); text-shadow:0 0 10px var(--cyan);
      }
      .event-banner.active-mission .event-title { color:var(--gold); text-shadow:0 0 10px var(--gold); }
      .event-desc { font-size:12px; color:rgba(255,255,255,0.65); line-height:1.5; }
      .event-timer { font-size:11px; font-weight:800; letter-spacing:2px; color:rgba(255,255,255,0.4); }
      .event-btns {
        display:flex; gap:8px; pointer-events:auto;
      }
      .event-btn {
        flex:1; padding:8px; border-radius:4px;
        font-size:11px; font-weight:800; letter-spacing:2px;
        border:1px solid; cursor:pointer; touch-action:none;
        transition:background 0.1s, box-shadow 0.1s;
      }
      .event-btn.accept {
        background:rgba(0,255,224,0.12); border-color:var(--cyan); color:var(--cyan);
      }
      .event-btn.accept:hover { background:rgba(0,255,224,0.25); box-shadow:0 0 12px rgba(0,255,224,0.3); }
      .event-btn.decline {
        background:rgba(255,42,80,0.10); border-color:var(--red); color:var(--red);
      }
      .event-btn.decline:hover { background:rgba(255,42,80,0.22); }

      /* ---- Shop button ---- */
      .shop-btn {
        position:absolute;
        right:calc(18px + env(safe-area-inset-right));
        bottom:calc(220px + env(safe-area-inset-bottom));
        padding:8px 14px; border-radius:4px;
        background:var(--dim); border:1px solid var(--border);
        color:var(--cyan); font-size:11px; font-weight:800; letter-spacing:2px;
        text-shadow:0 0 8px var(--cyan);
        pointer-events:auto; touch-action:none; cursor:pointer;
        transition:background 0.1s, box-shadow 0.1s;
      }
      .shop-btn:hover { background:rgba(0,255,224,0.1); box-shadow:0 0 14px rgba(0,255,224,0.2); }

      /* ---- Shop overlay ---- */
      .shop-overlay {
        position:fixed; inset:0; z-index:50;
        background:rgba(3,5,14,0.95);
        display:none; flex-direction:column;
        padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
                calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
        pointer-events:auto;
        animation:shop-in 0.2s ease-out;
      }
      @keyframes shop-in {
        from { opacity:0; transform:translateY(20px); }
        to   { opacity:1; transform:translateY(0); }
      }
      .shop-header {
        display:flex; align-items:center; justify-content:space-between;
        margin-bottom:16px; border-bottom:1px solid var(--border); padding-bottom:12px;
      }
      .shop-title {
        font-size:14px; font-weight:900; letter-spacing:4px;
        color:var(--cyan); text-shadow:0 0 10px var(--cyan);
      }
      .shop-close {
        background:none; border:1px solid var(--border); color:rgba(255,255,255,0.5);
        border-radius:4px; padding:6px 12px; font-size:14px; cursor:pointer;
        transition:color 0.1s, border-color 0.1s;
      }
      .shop-close:hover { color:#fff; border-color:rgba(255,255,255,0.5); }
      .shop-items {
        flex:1; overflow-y:auto; display:grid;
        grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
        gap:12px; padding-right:4px;
      }
      .shop-card {
        background:rgba(0,255,224,0.04); border:1px solid var(--border);
        border-radius:6px; padding:14px; display:flex; gap:14px; align-items:flex-start;
        cursor:pointer; transition:background 0.15s, box-shadow 0.15s, border-color 0.15s;
      }
      .shop-card:not(.disabled):hover {
        background:rgba(0,255,224,0.10);
        box-shadow:0 0 20px rgba(0,255,224,0.12);
        border-color:rgba(0,255,224,0.45);
      }
      .shop-card.disabled { opacity:0.4; cursor:not-allowed; }
      .shop-icon {
        width:36px; height:36px; flex-shrink:0;
        color:var(--cyan); display:flex; align-items:center; justify-content:center;
      }
      .shop-icon svg { width:28px; height:28px; }
      .shop-info { flex:1; min-width:0; }
      .shop-label {
        font-size:11px; font-weight:900; letter-spacing:3px;
        color:var(--cyan); margin-bottom:4px;
      }
      .shop-desc { font-size:12px; color:rgba(255,255,255,0.55); line-height:1.5; margin-bottom:8px; }
      .shop-meta { display:flex; justify-content:space-between; align-items:center; }
      .shop-level { font-size:10px; letter-spacing:2px; color:rgba(255,255,255,0.35); }
      .shop-price { font-size:13px; font-weight:800; color:var(--gold); letter-spacing:1px; }

      /* ---- Mute button ---- */
      .mute-btn {
        position:absolute;
        right:calc(18px + env(safe-area-inset-right));
        top:calc(28px + env(safe-area-inset-top));
        width:36px; height:36px; border-radius:4px;
        background:var(--dim); border:1px solid var(--border);
        color:rgba(255,255,255,0.5); font-size:15px;
        display:flex; align-items:center; justify-content:center;
        pointer-events:auto; touch-action:none; cursor:pointer;
        margin-top:80px;
      }

      /* ---- Text particles ---- */
      .text-particle {
        position:absolute; pointer-events:none;
        font-size:14px; font-weight:900; letter-spacing:1px;
        text-shadow:0 0 8px currentColor;
        white-space:nowrap; transform:translate(-50%,-50%);
      }
      .text-particle.large {
        font-size:18px; letter-spacing:3px;
        text-shadow:0 0 14px currentColor, 0 0 30px currentColor;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
