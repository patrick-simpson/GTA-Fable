name: Deploy to GitHub Pages

# GitHub Pages for this repo is in "deploy from branch" mode, with
# claude/gta-mobile-3d-prototype-i8qix8 as the source branch. This workflow
# builds on push to main and force-pushes the dist/ output as the new tip of
# that branch, so the branch deployment publishes the BUILT app (gh-pages
# pattern). dist/ includes CNAME (custom domain) and .nojekyll via public/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Push dist to Pages source branch
        run: |
          cd dist
          git init -b publish
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            HEAD:refs/heads/claude/gta-mobile-3d-prototype-i8qix8
