name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/gta-mobile-3d-prototype-i8qix8]
  workflow_dispatch:

# Workflow-level defaults — sync job overrides contents to write.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Runs only on main: fast-forwards the deploy branch so the
  # build+deploy jobs (which run only from that branch) are triggered.
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git push origin HEAD:refs/heads/claude/gta-mobile-3d-prototype-i8qix8 --force

  build:
    if: github.ref == 'refs/heads/claude/gta-mobile-3d-prototype-i8qix8'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/claude/gta-mobile-3d-prototype-i8qix8'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
